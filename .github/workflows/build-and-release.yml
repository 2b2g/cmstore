# CM Suite Module Store — Build & Release Pipeline
#
# This workflow:
# 1. Triggers when modules.json or modules/ directory changes (PR merge to main)
# 2. Validates module structure
# 3. Compiles frontend (if any)
# 4. Packages each module as ZIP
# 5. Creates GitHub Releases with the ZIP artifacts
# 6. Updates modules.json with correct checksums and file sizes

name: Build & Release Modules

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "modules.json"
  workflow_dispatch:
    inputs:
      module_id:
        description: "Specific module to build (leave empty for all)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.changed.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.module_id }}" ]; then
            echo "modules=[\"${{ inputs.module_id }}\"]" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} -- modules/ | \
              sed 's|modules/||' | cut -d'/' -f1 | sort -u | jq -R -s -c 'split("\n")[:-1]')
            echo "modules=${CHANGED:-[]}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate module manifests
        run: |
          MODULES='${{ steps.changed.outputs.modules }}'
          if [ "$MODULES" == "[]" ] || [ -z "$MODULES" ]; then
            echo "No modules changed. Skipping validation."
            exit 0
          fi
          echo "$MODULES" | jq -r '.[]' | while read -r MOD_ID; do
            MANIFEST="modules/${MOD_ID}/manifest.json"
            if [ ! -f "$MANIFEST" ]; then
              echo "::error::Module ${MOD_ID} missing manifest.json"
              exit 1
            fi
            # Validate required fields
            for FIELD in id name version author minCoreVersion entry; do
              VALUE=$(jq -r ".${FIELD} // empty" "$MANIFEST")
              if [ -z "$VALUE" ]; then
                echo "::error::Module ${MOD_ID} missing field: ${FIELD}"
                exit 1
              fi
            done
            # Validate entry file exists
            ENTRY=$(jq -r '.entry' "$MANIFEST")
            if [ ! -f "modules/${MOD_ID}/${ENTRY}" ]; then
              echo "::error::Module ${MOD_ID} entry file not found: ${ENTRY}"
              exit 1
            fi
            echo "✅ ${MOD_ID} validated"
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.validate.outputs.changed-modules) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install esbuild (for frontend compilation)
        run: npm install esbuild --no-save
        working-directory: ./

      - name: Build frontend (if hasFrontend)
        run: |
          MANIFEST="modules/${{ matrix.module }}/manifest.json"
          HAS_FRONTEND=$(jq -r '.hasFrontend // false' "$MANIFEST")
          if [ "$HAS_FRONTEND" = "true" ]; then
            echo "📦 Building frontend for ${{ matrix.module }}..."
            # Frontend sources must be bundled separately.
            # For CI, we just verify the frontend/ directory exists.
            if [ ! -d "modules/${{ matrix.module }}/frontend" ]; then
              echo "::warning::Module ${{ matrix.module }} has hasFrontend=true but no frontend/ directory"
            fi
          fi

      - name: Package module as ZIP
        run: |
          MOD_DIR="modules/${{ matrix.module }}"
          ZIP_NAME="${{ matrix.module }}.zip"
          mkdir -p dist
          cd "$MOD_DIR"
          zip -r "../../dist/${ZIP_NAME}" . \
            -x "node_modules/*" ".git/*" "*.map"
          cd ../..
          SIZE=$(stat -c%s "dist/${ZIP_NAME}")
          SHA256=$(sha256sum "dist/${ZIP_NAME}" | cut -d' ' -f1)
          echo "✅ ${ZIP_NAME} — ${SIZE} bytes — SHA256: ${SHA256}"
          echo "size=${SIZE}" >> $GITHUB_ENV
          echo "sha256=${SHA256}" >> $GITHUB_ENV
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
        id: package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.module }}-v${{ fromJSON(steps.manifest.outputs.version) }}
          name: "${{ matrix.module }} v${{ fromJSON(steps.manifest.outputs.version) }}"
          body: |
            ## ${{ matrix.module }}
            
            Release automático del módulo.
            
            **Versión:** ${{ fromJSON(steps.manifest.outputs.version) }}
            **Tamaño:** ${{ env.size }} bytes
            **SHA256:** `${{ env.sha256 }}`
          files: dist/${{ env.zip_name }}
          make_latest: false

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(jq -r '.version' "modules/${{ matrix.module }}/manifest.json")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  update-catalog:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update modules.json with checksums
        run: |
          # Iterate over all modules and update modules.json with checksums
          for MOD_DIR in modules/*/; do
            MOD_ID=$(basename "$MOD_DIR")
            MANIFEST="${MOD_DIR}manifest.json"
            if [ ! -f "$MANIFEST" ]; then continue; fi

            # Get latest release download URL
            VERSION=$(jq -r '.version' "$MANIFEST")
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${MOD_ID}-v${VERSION}/${MOD_ID}.zip"

            # Update modules.json entry
            jq --arg id "$MOD_ID" \
               --arg url "$DOWNLOAD_URL" \
               '.modules = [.modules[] | if .id == $id then .download_url = $url else . end]' \
               modules.json > modules.tmp && mv modules.tmp modules.json
          done

      - name: Commit updated modules.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update module download URLs [skip ci]"
          file_pattern: modules.json
